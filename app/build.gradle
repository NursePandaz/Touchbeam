plugins { id 'com.android.application' }
android {
    namespace 'dev.beam.classic'
    compileSdk 35
    defaultConfig {
        // Preserve the installed app identity so Touchbeam updates existing installs.
        applicationId 'dev.beam.classic'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.9.3-test'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
